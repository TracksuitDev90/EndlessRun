<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fisherman viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6efe4; overflow: hidden; }
      canvas { display: block; }
      #label { position: fixed; left: 8px; top: 6px; font: 12px ui-monospace, monospace; color: #6b5a4a; }
    </style>
  </head>
  <body>
    <div id="label"></div>
    <script type="module">
      // Reed running, jumping and landing, as a film strip - his boots'
      // splashes, the fish swinging on its line, the tank on his back -
      // stepped at a steady 60 a second from where the game would have him.
      // Serve the repository root and open tools/runner/fisher.html.
      //   ?strip=<n>&every=<frames>  n frames, every so many frames apart
      //   &from=<s>      where the strip starts, from the take-off (- before)
      //   &trick=puddle|stride|star   which jump (else as dealt)
      //   &style=pump|reach           which run
      //   &v=<m/s>       his pace (12 to 28 in the game)
      //   &deck=<m>      the road under him that high (a rooftop, a walk)
      //   &view=chase|side|front      where the camera is (chase: as the game's)
      //   &jump=0        no jump: just running
      import * as THREE from '../../vendor/three/three.module.min.js';
      import { shared } from '../../src/render/shaders.js';
      import { makeMarksTexture, makeNoiseTexture } from '../../src/render/textures.js';
      import { loadRunner } from '../../src/game/runner-asset.js';
      import { characterById } from '../../src/game/characters.js';
      import { WORLD_DEFS } from '../../src/world/index.js';

      const q = new URLSearchParams(location.search);
      const n = Number(q.get('strip') || 6);
      const every = Number(q.get('every') || 5);
      const from = Number(q.get('from') || 0);
      const V = Number(q.get('v') || 14);
      const deck = Number(q.get('deck') || 0);
      const view = q.get('view') || 'chase';
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      renderer.autoClear = false;
      document.body.appendChild(renderer.domElement);
      shared.uMarks.value = makeMarksTexture();
      shared.uNoise.value = makeNoiseTexture();
      shared.uResolution.value.set(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio());
      const char = characterById('fisher');
      const asset = await loadRunner('../../' + char.asset);
      const runner = char.make(WORLD_DEFS[0].env, asset);
      runner.reset();
      if (q.get('style')) runner.holdStyle(q.get('style'));
      runner.mode = 'run';
      runner.y = deck;
      const scene = new THREE.Scene();
      scene.add(...runner.objects);
      runner.shadow.visible = false;
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 60).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xd9ccb8 }));
      ground.position.set(0, deck - 0.001, -10);
      scene.add(ground);
      // stripes across the road, to see it go by
      for (let k = 0; k < 30; k++) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(8, 0.08).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xc8b9a2 }));
        m.position.set(0, deck, -k * 2);
        m.userData.k = k;
        scene.add(m);
      }
      const dt = 1 / 60;
      let dist = 0;
      const groundAt = () => deck;
      const step = () => {
        runner.update(dt, V, groundAt);
        dist += V * dt;
        runner.place(0, dist);
      };
      for (let i = 0; i < 90; i++) step();
      if (q.get('trick')) runner.nextTrick = q.get('trick');
      const frames = [];
      const start = Math.round(from / dt);
      if (start < 0) for (let i = 0; i < -start; i++) step();
      if (q.get('jump') !== '0') runner.action('up');
      for (let i = 0; i < Math.max(0, start); i++) step();
      const cam = new THREE.PerspectiveCamera(view === 'chase' ? 50 : 30, innerWidth / n / innerHeight, 0.1, 80);
      const w = innerWidth / n;
      renderer.setClearColor(0xf6efe4, 1);
      renderer.clear();
      for (let f = 0; f < n; f++) {
        if (view === 'side') cam.position.set(-4.2, deck + 1.1, -0.3), cam.lookAt(0, deck + 0.85, -0.3);
        else if (view === 'front') cam.position.set(0.3, deck + 1.2, -4.5), cam.lookAt(0, deck + 0.9, 0);
        else cam.position.set(0, deck + 2.3, 3.9), cam.lookAt(0, deck + 0.9, -2.5);
        shared.uCamPos.value.copy(cam.position);
        shared.uTime.value = dist / V;
        for (const o of scene.children) if (o.userData.k !== undefined) o.position.z = ((o.userData.k * 2 + dist) % 60) - 50;
        renderer.setViewport(f * w, 0, w, innerHeight);
        renderer.setScissor(f * w, 0, w, innerHeight);
        renderer.setScissorTest(true);
        renderer.render(scene, cam);
        for (let i = 0; i < every; i++) step();
      }
      document.getElementById('label').textContent = `fisher · ${runner.trick} · every ${every} frames`;
      window.__ready = true;
    </script>
  </body>
</html>
