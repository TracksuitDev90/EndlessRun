<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Knotling viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6efe4; overflow: hidden; }
      canvas { display: block; }
      #label { position: fixed; left: 8px; top: 6px; font: 12px ui-monospace, monospace; color: #6b5a4a; }
    </style>
  </head>
  <body>
    <div id="label"></div>
    <script type="module">
      // Knotling, the living knot, turned round like a reference sheet, or a
      // film strip of him moving. Serve the repository root and open
      // tools/runner/knot.html.
      //   ?pose=stand|sit|roll|leap|duck|ring   what he's doing
      //   &t=<s>        how long into it (leap: how long he rolls first)
      //   &v=<m/s>      his pace over the ground
      //   &out=, &taut= the ring (pose=ring): how far fed out (0..1), how taut
      //   &world=<id>   the world he's lit by
      //   &views=left,front,back,right,three,backThree,top,game   one view each
      //   &strip=<n>&every=<frames>   ...or a film strip of the first view
      //   &zoom=, &y=, &z=, &up=   framing; &ink=0 hides the outline
      //   &bg=0         a transparent background (for portraits)
      //   &fps=30       step at 30 frames a second instead of 60
      //   &look=camera  his eyes on you; &pole=<rad> the opening at one pole of
      //                 him turned to you (turned that far about it)
      //   &hide=eyes,through,hollow,ghosts,fibres,dust,rope   leave those out
      import * as THREE from '../../vendor/three/three.module.min.js';
      import { shared } from '../../src/render/shaders.js';
      import { makeMarksTexture, makeNoiseTexture } from '../../src/render/textures.js';
      import { Knotling, RADIUS } from '../../src/game/knotling.js';
      import { WORLD_ORDER } from '../../src/world/index.js';
      import { CONFIG } from '../../src/config.js';

      const q = new URLSearchParams(location.search);
      const world = q.get('world') || 'village';
      const entry = WORLD_ORDER.find((e) => e.id === world) || WORLD_ORDER[0];
      const def = (await entry.load()).default;
      const pose = q.get('pose') || 'stand';
      const T = Number(q.get('t') || 1.2);
      const strip = Number(q.get('strip') || 0);
      const every = Number(q.get('every') || 3);
      const views = strip ? Array(strip).fill((q.get('views') || 'left').split(',')[0]) : (q.get('views') || 'left,front,back,three').split(',');
      const zoom = Number(q.get('zoom') || 1);
      const focusY = Number(q.get('y') || 0.4);
      const focusZ = Number(q.get('z') || 0);
      const transparent = q.get('bg') === '0';
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: transparent, preserveDrawingBuffer: true });
      if (transparent) document.body.style.background = document.documentElement.style.background = 'transparent';
      renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      renderer.autoClear = false;
      document.body.appendChild(renderer.domElement);
      shared.uMarks.value = makeMarksTexture();
      shared.uNoise.value = makeNoiseTexture();
      shared.uResolution.value.set(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio());
      // (no dream here, and no doorway's burst: the game sets these every
      // frame; a fresh Vector4's w is 1, which would light the burst)
      for (const k of ['uDream', 'uDream2', 'uDream3']) shared[k].value.set(0, 0, 0, 0);
      const kn = new Knotling(def.env);
      window.kn = kn;
      kn.u.uSunColor.value.set(0, 0, 0);
      const scene = new THREE.Scene();
      for (const o of kn.objects) if (o !== kn.shadow) scene.add(o);
      if (q.get('ink') === '0') kn.inkMesh.visible = false;
      // &hide=eyes,through,hollow,ghosts,fibres: leave parts of him out (to
      // see what's what)
      const hide = new Set((q.get('hide') || '').split(','));
      const hidden = () => {
        if (hide.has('eyes')) kn.eyeMeshes.forEach((m) => (m.visible = false));
        if (hide.has('through')) kn.eyeThrough.forEach((m) => (m.visible = false));
        if (hide.has('hollow')) kn.hollow.visible = false;
        if (hide.has('ghosts')) kn.ghosts.forEach((m) => (m.visible = false));
        if (hide.has('fibres')) kn.fibres.visible = false;
        if (hide.has('dust')) kn.dust.points.visible = false;
        if (hide.has('rope')) kn.mesh.visible = kn.inkMesh.visible = false;
        if (hide.has('ink')) kn.inkMesh.visible = false;
      };
      const groundCol = new THREE.Color(q.get('ground') || '#d9ccb8');
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 200).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: groundCol }));
      ground.position.y = -0.001;
      if (!transparent) scene.add(ground);
      for (let k = -30; k <= 120 && !transparent; k++) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.004, 0.08), new THREE.MeshBasicMaterial({ color: 0x8a7a64 }));
        m.position.set(0.9, 0, -k);
        scene.add(m);
      }
      // (the runner's place, for where he looks)
      const yaws = { front: 0, left: -Math.PI / 2, back: Math.PI, right: Math.PI / 2, three: 0.7, threeL: -0.7, backThree: Math.PI - 0.7, top: 0 };
      const w = innerWidth / views.length;
      renderer.setClearColor(0xf6efe4, transparent ? 0 : 1);
      renderer.clear();
      let travel = 0;
      const cam = new THREE.PerspectiveCamera(26 / zoom, w / innerHeight, 0.1, 120);
      function aim(i) {
        const name = views[i];
        if (name === 'game') {
          // the runner's camera: the runner a lane to his left, a little ahead
          cam.fov = 70;
          cam.aspect = w / innerHeight;
          cam.updateProjectionMatrix();
          const rx = x + 1.2, rz = -travel - 0.9;
          cam.position.set(rx, CONFIG.camera.height, rz + CONFIG.camera.back);
          cam.lookAt(rx, CONFIG.camera.lookHeight, rz - CONFIG.camera.lookAhead);
        } else {
          cam.fov = 26 / zoom;
          cam.aspect = w / innerHeight;
          cam.updateProjectionMatrix();
          const a = yaws[name] ?? 0;
          const d = 6.2;
          const up = name === 'top' ? 6 : Number(q.get('up') || 0.9);
          const fy = focusY + y * 0.85;
          cam.position.set(Math.sin(a) * d + x, fy + up, focusZ - Math.cos(a) * d - travel);
          cam.lookAt(x, fy, focusZ - travel);
        }
        cam.updateMatrixWorld();
        shared.uCamPos.value.copy(cam.position);
      }
      function render(i) {
        aim(i);
        hidden();
        renderer.setViewport(i * w, 0, w, innerHeight);
        renderer.setScissor(i * w, 0, w, innerHeight);
        renderer.setScissorTest(true);
        renderer.render(scene, cam);
      }

      // --- the simulation ---------------------------------------------------
      const dt = 1 / Number(q.get('fps') || 60);
      const C = { ...CONFIG.companion, ...(CONFIG.companion.knot || {}) };
      const v = Number(q.get('v') || 10);
      const G = C.gravity;
      const jump = pose === 'leap' ? 1.1 : 0;
      const wind = 0.14;
      const at = new THREE.Vector3();
      const qi = new THREE.Quaternion();
      const vel = new THREE.Vector3();
      let y = 0, vy = 0, x = 0, air = null, crouch = null, jumped = false;
      function step(i) {
        const s = i * dt;
        const moving = pose === 'roll' || pose === 'leap' || pose === 'duck';
        if (jump && !jumped && s >= T) {
          crouch = { t: 0 };
          jumped = true;
        }
        if (crouch) {
          crouch.t += dt;
          if (crouch.t >= wind) {
            crouch = null;
            vy = Math.sqrt(2 * G * jump);
            air = { t: 0, T: (2 * vy) / G };
          }
        }
        if (air) {
          y += vy * dt - 0.5 * G * dt * dt;
          vy -= G * dt;
          air.t += dt;
          if (y <= 0 && vy < 0) {
            y = 0;
            kn.land(Math.min(1.4, -vy / 8));
            vy = 0;
            air = null;
          }
        }
        kn.lowTarget = pose === 'duck' && s > T * 0.5 ? 1 : 0;
        if (moving) travel += v * dt;
        vel.set(0, air ? vy : 0, moving ? -v : 0);
        at.set(x, y, -travel);
        kn.place(at, qi, 0, 0);
        kn.gazeAt = q.get('look') === 'camera' ? cam.position.clone() : new THREE.Vector3(x + 1.2, 1.5, -travel - 1);
        if (pose === 'ring') {
          kn.ringOut = Number(q.get('out') || 1);
          kn.ringTaut = Number(q.get('taut') || 0);
          kn.ringAt.set(x, 1.25, -travel - 0.85);
        }
        aim(0);
        let ctx;
        if (air) ctx = { speed: v, vel, mode: 'air', airT: air.t, airDur: air.T, airKind: 'leap' };
        else if (moving) ctx = { speed: v, vel, mode: 'run', crouch: crouch ? crouch.t / wind : 0 };
        else ctx = { speed: 0, vel, mode: pose === 'sit' ? 'sit' : 'stand' };
        kn.update(dt, ctx);
        kn.after(-travel, travel);
      }
      // &pole=1: turned so the opening at one pole of the knot faces you (a
      // portrait: his eyes looking straight out of it, as on his sheet)
      if (q.get('pole')) {
        aim(0);
        const to = cam.position.clone().sub(new THREE.Vector3(x, RADIUS, -travel)).normalize();
        kn.Q.setFromUnitVectors(new THREE.Vector3(0, 1, 0), to).premultiply(new THREE.Quaternion().setFromAxisAngle(to, Number(q.get('pole'))));
      }
      const start = Math.max(1, Math.round((jump ? Math.max(0.5, T - 0.05) : T) / dt));
      let frame = 0;
      for (; frame < start; frame++) step(frame);
      if (strip) {
        for (let i = 0; i < views.length; i++) {
          render(i);
          for (let k = 0; k < every; k++) step(frame++);
        }
      } else views.forEach((_, i) => render(i));
      document.getElementById('label').textContent = transparent ? '' : `knotling · ${pose} · ${world}${strip ? ` · every ${every} frames` : ''}`;
      window.renderView = render;
      window.scene = scene;
      window.renderer = renderer;
      window.__ready = true;
    </script>
  </body>
</html>
