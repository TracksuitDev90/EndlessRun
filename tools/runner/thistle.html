<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thistle viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6efe4; overflow: hidden; }
      canvas { display: block; }
      #label { position: fixed; left: 8px; top: 6px; font: 12px ui-monospace, monospace; color: #6b5a4a; }
    </style>
  </head>
  <body>
    <div id="label"></div>
    <script type="module">
      // Teasel, the storm thistle, turned round like a reference sheet, or a
      // film strip of it moving. Serve the repository root and open
      // tools/runner/thistle.html.
      //   ?pose=stand|sit|run|leap|glide|zap   what it's doing
      //   &t=<s>        how long into it (the jumps: how long it runs first,
      //                 then winds up and jumps; zap: how long it runs first,
      //                 then travels through a spark 2.4 m across and ahead)
      //   &v=<m/s>      its pace over the ground
      //   &charge=<0..1>  how much static it holds (default 0); &build=<s>
      //                 instead: it charges from nothing over that long
      //   &views=left,front,back,right,three,backThree,top,game   one view
      //                 each (game: from the runner's camera, a lane over,
      //                 phone-shaped)...
      //   &strip=<n>&every=<frames>   ...or a film strip: n frames of the
      //                 first view, every so many frames apart (60 a second)
      //   &from=<s>     where the strip starts
      //   &zoom=, &y=, &z=, &up=   framing; &ink=0 hides the outline
      //   &bg=0         a transparent background (for portraits)
      //   &look=camera  its eyes turned to you
      //   &follow=0     the camera stays put as it jumps
      import * as THREE from '../../vendor/three/three.module.min.js';
      import { shared } from '../../src/render/shaders.js';
      import { makeMarksTexture, makeNoiseTexture } from '../../src/render/textures.js';
      import { loadRunner } from '../../src/game/runner-asset.js';
      import { Thistle, ZAP } from '../../src/game/thistle.js';
      import { WORLD_ORDER } from '../../src/world/index.js';
      import { CONFIG } from '../../src/config.js';
      const WORLD_DEFS = await Promise.all(WORLD_ORDER.map((e) => e.load().then((m) => m.default)));

      const q = new URLSearchParams(location.search);
      const pose = q.get('pose') || 'stand';
      const T = Number(q.get('t') || 1.2);
      const strip = Number(q.get('strip') || 0);
      const every = Number(q.get('every') || 3);
      const views = strip ? Array(strip).fill((q.get('views') || 'left').split(',')[0]) : (q.get('views') || 'left,front,back,three').split(',');
      const zoom = Number(q.get('zoom') || 1);
      const focusY = Number(q.get('y') || 0.42);
      const focusZ = Number(q.get('z') || 0);
      const transparent = q.get('bg') === '0';
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: transparent, preserveDrawingBuffer: true });
      if (transparent) document.body.style.background = document.documentElement.style.background = 'transparent';
      renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      renderer.autoClear = false;
      document.body.appendChild(renderer.domElement);
      shared.uMarks.value = makeMarksTexture();
      shared.uNoise.value = makeNoiseTexture();
      shared.uResolution.value.set(innerWidth, innerHeight);
      const asset = await loadRunner('../../assets/thistle/');
      const env = WORLD_DEFS[Number(q.get('world') || 0)].env;
      const th = new Thistle(env, asset);
      window.th = th;
      th.u.uSunColor.value.set(0, 0, 0);
      const scene = new THREE.Scene();
      for (const o of th.objects) if (o !== th.shadow) scene.add(o);
      if (q.get('ink') === '0') th.inkMesh.visible = false;
      // (&hide=crown,arcs,body: leave parts out, to look at the rest)
      const hide = (q.get('hide') || '').split(',');
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xd9ccb8 }));
      ground.position.y = -0.001;
      if (!transparent) scene.add(ground);
      // (a stripe every metre, so you can see it go)
      for (let k = -30; k <= 30 && !transparent; k++) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.004, 0.04), new THREE.MeshBasicMaterial({ color: 0xb8a890 }));
        m.position.set(-0.7, 0, -k);
        scene.add(m);
      }
      const yaws = { front: 0, left: -Math.PI / 2, back: Math.PI, right: Math.PI / 2, three: -0.7, backThree: Math.PI - 0.7, top: 0 };
      const w = innerWidth / views.length;
      renderer.setClearColor(0xf6efe4, transparent ? 0 : 1);
      renderer.clear();
      let travel = 0;
      const cam = new THREE.PerspectiveCamera(22 / zoom, w / innerHeight, 0.1, 80);
      function render(i) {
        const name = views[i];
        if (name === 'game') {
          // the runner's camera: the runner a lane to its left, a little behind it
          cam.fov = 76;
          cam.aspect = w / innerHeight;
          cam.updateProjectionMatrix();
          const rx = x - 2.4, rz = -travel + 1.0;
          cam.position.set(rx, CONFIG.camera.height, rz + CONFIG.camera.back);
          cam.lookAt(rx, CONFIG.camera.lookHeight, rz - CONFIG.camera.lookAhead);
        } else {
          cam.fov = 22 / zoom;
          cam.aspect = w / innerHeight;
          cam.updateProjectionMatrix();
          const a = yaws[name] ?? 0;
          const d = 4.2;
          const up = name === 'top' ? 4 : Number(q.get('up') || 0.45);
          const fy = focusY + (q.get('follow') === '0' ? 0 : y * 0.85);
          cam.position.set(Math.sin(a) * d + x, fy + up, focusZ - Math.cos(a) * d - travel);
          cam.lookAt(x, fy, focusZ - travel);
        }
        shared.uCamPos.value.copy(cam.position);
        renderer.setViewport(i * w, 0, w, innerHeight);
        renderer.setScissor(i * w, 0, w, innerHeight);
        renderer.setScissorTest(true);
        renderer.render(scene, cam);
      }

      // --- the simulation ---------------------------------------------------
      const dt = 1 / 60;
      const C = { ...CONFIG.companion, ...(CONFIG.companion.thistle || {}) };
      const v = Number(q.get('v') || 12);
      const G = C.gravity;
      const jump = { leap: C.leap, glide: C.glide?.hop ?? 0.55 }[pose];
      const wind = (C.windup && C.windup.leap) || 0.1;
      const build = Number(q.get('build') || 0);
      const at = new THREE.Vector3();
      const qi = new THREE.Quaternion();
      const vel = new THREE.Vector3();
      let y = 0, vy = 0, x = 0, air = null, crouch = null, jumped = false, zapped = false;
      function step(i) {
        const s = i * dt;
        const moving = pose === 'run' || pose === 'zap' || jump;
        th.charge = build ? Math.min(1, s / build) : Number(q.get('charge') || (pose === 'zap' ? 1 : 0));
        if (jump && !jumped && s >= T) {
          crouch = { t: 0 };
          jumped = true;
        }
        if (crouch) {
          crouch.t += dt;
          if (crouch.t >= wind) {
            crouch = null;
            vy = Math.sqrt(2 * G * jump);
            air = { t: 0, T: (2 * vy) / G };
          }
        }
        let glide = 0;
        if (air) {
          // (gliding: once over the top it falls slowly, held up by its crown)
          const g = pose === 'glide' && vy < 0 ? G * (C.glide?.fall ?? 0.22) : G;
          if (pose === 'glide' && vy < 0) vy = Math.max(vy, -(C.glide?.sink ?? 1.4));
          glide = pose === 'glide' && vy < 0.5 ? 1 : 0;
          y += vy * dt - 0.5 * g * dt * dt;
          vy -= g * dt;
          air.t += dt;
          if (y <= 0 && vy < 0) {
            y = 0;
            th.land(Math.min(1.4, -vy / 8));
            vy = 0;
            air = null;
          }
        }
        th.glide += (glide - th.glide) * (1 - Math.exp(-dt * 8));
        if (pose === 'zap' && !zapped && s >= T) {
          zapped = true;
          th.zap({ x, y: 0, d: travel }, { x: x + 2.4, y: 0, d: travel + v * (ZAP.lock + ZAP.travel) + 2.0 });
        }
        if (th.zapReady) {
          x += 2.4;
          travel = th.zapTo.d - v * 0 ;
          th.arrive();
        }
        if (zapped && th.loosed && th.charge > 0 && !build) q.set('charge', '0');
        if (moving) travel += v * dt;
        vel.set(0, air ? vy : 0, moving ? -v : 0);
        at.set(x, y, -travel);
        th.place(at, qi, 0, 0);
        th.happy = 0;
        th.act = { idle: pose === 'sit' || pose === 'stand' ? 1 : 0 };
        if (q.get('look') === 'camera') {
          th.lookAt = new THREE.Vector3(0, 0.5, -4);
          th.lookW = 1;
        }
        let ctx;
        if (air) ctx = { speed: v, vel, mode: 'air', airT: air.t, airDur: air.T, airKind: pose, fall: G };
        else if (moving) ctx = { speed: v, vel, mode: 'run', crouch: crouch ? crouch.t / wind : 0, crouchKind: pose, lat: 0 };
        else ctx = { speed: 0, vel, mode: pose };
        th.update(dt, ctx);
        th.after(-travel, travel);
      }
      const hideParts = () => {
        if (hide.includes('crown')) th.crown.mesh.visible = false;
        if (hide.includes('arcs')) th.arcs.mesh.visible = false;
        if (hide.includes('body')) th.root.visible = false;
      };
      const start = Math.max(1, Math.round((q.has('from') ? Number(q.get('from')) : jump || pose === 'zap' ? Math.max(0.5, T - 0.05) : T) / dt));
      let frame = 0;
      for (; frame < start; frame++) step(frame);
      hideParts();
      if (strip) {
        for (let i = 0; i < views.length; i++) {
          hideParts();
          render(i);
          for (let k = 0; k < every; k++) step(frame++);
        }
      } else views.forEach((_, i) => render(i));
      document.getElementById('label').textContent = transparent ? '' : `thistle · ${pose} · charge ${th.charge.toFixed(2)}${strip ? ` · every ${every} frames` : ''}`;
      window.__ready = true;
    </script>
  </body>
</html>
