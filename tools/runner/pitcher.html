<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pitcher viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6efe4; overflow: hidden; }
      canvas { display: block; }
      #label { position: fixed; left: 8px; top: 6px; font: 12px ui-monospace, monospace; color: #6b5a4a; }
    </style>
  </head>
  <body>
    <div id="label"></div>
    <script type="module">
      // Nep turned round like a reference sheet, or a film strip of him
      // moving. Serve the repository root and open tools/runner/pitcher.html.
      //   ?pose=stand|sit|run|leap|hop|whirl|peek   what he's doing
      //   &t=<s>        how long into it (for the jumps and the twirl: how
      //                 long he runs first, then winds up and jumps, or
      //                 pulls up and twirls)
      //   &v=<m/s>      his pace over the ground (run and the jumps)
      //   &turn=<m/s²>  run swerving across the road (to slosh the water)
      //   &views=left,front,back,right,three,backThree,top   one view each...
      //   &strip=<n>&every=<frames>   ...or a film strip: n frames of the
      //                 first view, every so many frames apart (at 60 a second)
      //   &from=<s>     where the strip starts (default: just before the jump)
      //   &zoom=, &y=, &z=, &up=   framing; &ink=0 hides the outline
      //   &bg=0         a transparent background (for portraits)
      //   &look=camera  his eyes (and leaf) turned to you
      //   &follow=0     the camera stays put as he jumps (it follows by default)
      //   &act=totter|shake|bask|flail|sway   one of his flourishes, held
      //                 (as his mind, sprout.js, sets them)
      // The jumps are driven as the game drives them (a wind-up crouch, a
      // launch, a flight under his gravity, a landing); his drops and
      // crumbs are drawn where they fly.
      import * as THREE from '../../vendor/three/three.module.min.js';
      import { shared } from '../../src/render/shaders.js';
      import { makeMarksTexture, makeNoiseTexture } from '../../src/render/textures.js';
      import { loadRunner } from '../../src/game/runner-asset.js';
      import { Pitcher } from '../../src/game/pitcher.js';
      import { WORLD_DEFS } from '../../src/world/index.js';
      import { CONFIG } from '../../src/config.js';

      const q = new URLSearchParams(location.search);
      const pose = q.get('pose') || 'stand';
      const T = Number(q.get('t') || 1.2);
      const strip = Number(q.get('strip') || 0);
      const every = Number(q.get('every') || 3);
      const views = strip ? Array(strip).fill((q.get('views') || 'left').split(',')[0]) : (q.get('views') || 'left,front,back,three').split(',');
      const zoom = Number(q.get('zoom') || 1);
      const focusY = Number(q.get('y') || 0.45);
      const focusZ = Number(q.get('z') || 0);
      const transparent = q.get('bg') === '0';
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: transparent, preserveDrawingBuffer: true });
      if (transparent) document.body.style.background = document.documentElement.style.background = 'transparent';
      renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      renderer.autoClear = false;
      document.body.appendChild(renderer.domElement);
      shared.uMarks.value = makeMarksTexture();
      shared.uNoise.value = makeNoiseTexture();
      shared.uResolution.value.set(innerWidth, innerHeight);
      const asset = await loadRunner('../../assets/pitcher/');
      const env = WORLD_DEFS[Number(q.get('world') || 0)].env;
      const nep = new Pitcher(env, asset);
      window.nep = nep;
      nep.u.uSunColor.value.set(0, 0, 0);
      const scene = new THREE.Scene();
      scene.add(nep.root);
      scene.add(nep.dust.points);
      if (q.get('ink') === '0') nep.inkMesh.visible = false;
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(4, 4).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xd9ccb8 }));
      ground.position.y = -0.001;
      if (!transparent) scene.add(ground);
      for (let k = 0; k <= 10 && !transparent; k++) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.004, 0.03), new THREE.MeshBasicMaterial({ color: k % 5 ? 0xb8a890 : 0x8a7a64 }));
        m.position.set(-0.45, k * 0.1, 0.45);
        scene.add(m);
      }
      const cam = new THREE.PerspectiveCamera(22 / zoom, innerWidth / views.length / innerHeight, 0.1, 50);
      const yaws = { front: 0, left: -Math.PI / 2, back: Math.PI, right: Math.PI / 2, three: -0.7, backThree: Math.PI - 0.7, top: 0 };
      const w = innerWidth / views.length;
      renderer.setClearColor(0xf6efe4, transparent ? 0 : 1);
      renderer.clear();
      // (the scene drifts by under him as he runs: the camera goes with him)
      let travel = 0;
      function render(i) {
        const name = views[i];
        const a = yaws[name] ?? 0;
        const d = 4.2;
        const up = name === 'top' ? 4 : Number(q.get('up') || 0.45);
        const fy = focusY + (q.get('follow') === '0' ? 0 : y * 0.85);
        cam.position.set(Math.sin(a) * d + x, fy + up, focusZ - Math.cos(a) * d - travel);
        cam.lookAt(x, fy, focusZ - travel);
        shared.uCamPos.value.copy(cam.position);
        renderer.setViewport(i * w, 0, w, innerHeight);
        renderer.setScissor(i * w, 0, w, innerHeight);
        renderer.setScissorTest(true);
        renderer.render(scene, cam);
      }

      // --- the simulation ---------------------------------------------------
      const dt = 1 / 60;
      const C = { ...CONFIG.companion, ...CONFIG.companion.pitcher };
      const v = Number(q.get('v') || 12);
      const turn = Number(q.get('turn') || 0);
      const jump = { leap: C.leap, hop: 0.42 }[pose];
      const WD = C.whirl.dur;
      const whirlAt = (s) => {
        if (pose !== 'whirl' || s < T) return [0, 0];
        const w = s - T, lead = 0.14;
        const k = Math.min(1, Math.max(0, (w - lead) / WD));
        const e = k * k * k * (k * (k * 6 - 15) + 10);
        const c = Math.min(1, w / (lead + 0.12)) * (1 - Math.min(1, Math.max(0, (k - 0.78) / 0.22)));
        return k >= 1 ? [0, 0] : [Math.PI * 2 * e, c * c * (3 - 2 * c)];
      };
      const G = C.gravity;
      const wind = C.windup[pose] || 0;
      const at = new THREE.Vector3();
      const qi = new THREE.Quaternion();
      const vel = new THREE.Vector3();
      let y = 0, vy = 0, x = 0, vx = 0, air = null, crouch = null, jumped = false;
      function step(i) {
        const s = i * dt;
        const moving = pose === 'run' || pose === 'whirl' || jump;
        const [spin, curl] = whirlAt(s);
        if (jump && !jumped && s >= T) {
          crouch = { t: 0 };
          jumped = true;
        }
        if (crouch) {
          crouch.t += dt;
          if (crouch.t >= wind) {
            crouch = null;
            vy = Math.sqrt(2 * G * jump);
            air = { t: 0, T: (2 * vy) / G };
          }
        }
        if (air) {
          y += vy * dt - 0.5 * G * dt * dt;
          vy -= G * dt;
          air.t += dt;
          if (y <= 0 && vy < 0) {
            y = 0;
            nep.land(Math.min(1.4, -vy / 8));
            vy = 0;
            air = null;
          }
        }
        // (swerving: across the road and back, hard)
        if (turn) {
          const ax = turn * Math.sign(Math.sin(s * 2.2));
          vx += ax * dt;
          x += vx * dt;
        }
        if (moving && !(pose === 'whirl' && spin)) travel += v * dt;
        vel.set(vx, air ? vy : 0, moving ? -v : 0);
        at.set(x, y, -travel);
        qi.setFromAxisAngle(new THREE.Vector3(0, 1, 0), spin + (turn ? Math.atan2(-vx, Math.max(v, 3)) * 0.9 : 0));
        nep.place(at, qi, 0, 0);
        nep.happy = pose === 'stand' && q.get('happy') ? 1 : 0;
        nep.act = q.get('act') ? { [q.get('act')]: 1, swayDir: Math.cos(s * 2.4) } : { idle: pose === 'sit' || pose === 'stand' ? 1 : 0 };
        if (q.get('look') === 'camera') {
          nep.lookAt = new THREE.Vector3(0, 0.5, -4).applyQuaternion(qi.clone().invert());
          nep.lookW = 1;
        }
        let ctx;
        if (air) ctx = { speed: v, vel, mode: 'air', airT: air.t, airDur: air.T, airKind: pose, fall: G };
        else if (moving) ctx = { speed: curl ? Math.max(v, 6) : v, vel, mode: 'run', crouch: crouch ? crouch.t / wind : 0, crouchKind: pose, curl, lat: vx };
        else ctx = { speed: 0, vel, mode: pose === 'peek' ? 'stand' : pose };
        nep.update(dt, ctx);
        const before = nep.dust.next;
        nep.after(-travel, travel);
        window.__emitted = (window.__emitted || 0) + ((nep.dust.next - before + nep.dust.max) % nep.dust.max);
      }
      const start = Math.max(1, Math.round((q.has('from') ? Number(q.get('from')) : jump || pose === 'whirl' ? Math.max(0.5, T - 0.05) : T) / dt));
      let frame = 0;
      for (; frame < start; frame++) step(frame);
      if (strip) {
        for (let i = 0; i < views.length; i++) {
          render(i);
          for (let k = 0; k < every; k++) step(frame++);
        }
      } else views.forEach((_, i) => render(i));
      document.getElementById('label').textContent = transparent ? '' : `pitcher · ${pose}${strip ? ` · every ${every} frames` : ''}`;
      window.__ready = true;
    </script>
  </body>
</html>
